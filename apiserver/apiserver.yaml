# ============================================================
# apiserver 配置文件
# 所有配置项都可通过环境变量覆盖（如 PG_DSN, DROP_GRPC 等）
# ============================================================

# HTTP 服务配置
server:
  port: 8191          # 监听端口
  mode: release       # Gin 运行模式：debug / release / test

# 数据库配置
database:
  dsn: "host=localhost user=postgres password=dev dbname=drop sslmode=disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime_sec: 3600

# gRPC 连接 drop_server
grpc:
  addr: "localhost:50051"
  timeout_sec: 5
  # 生产环境如启用 mTLS，请配置以下三个文件路径；本地开发默认使用 insecure gRPC。
  mtls_cert_file: ""
  mtls_key_file: ""
  mtls_ca_file: ""

# 对象存储 MinIO
storage:
  endpoint: "localhost:9000"
  access_key: "drop"
  secret_key: "dropdrop"
  use_ssl: false
  bucket: "drop-data"
  presign_expire_sec: 900   # 预签名 URL 有效期（秒），默认 15 分钟

# 存储保留期配置
retention:
  enabled: true
  raw_retention_hours: 24       # 原始采集数据 RAW / INTERMEDIATE / LOG 保留 24 小时
  result_retention_hours: 720   # RESULT / MANIFEST 默认保留 30 天
  continuous_summary_retention_hours: 168 # 冷层摘要保留 7 天
  cleanup_interval_sec: 3600
  batch_limit: 200

# 阶段三：内建持续剖析块存储（compactor）
# 每个 session 每小时一个 gzip 压缩块。默认关闭（等价旧行为：每分钟一个 JSON 对象）；
# 生产由环境变量 CONTINUOUS_BLOCK_ENABLED=true 开启。
continuous_block:
  enabled: false
  window_sec: 3600                 # UTC 小时桶长度（秒）
  compaction_delay_sec: 600        # 桶结束多久后允许合并（给迟到 batch 留窗口）
  compaction_interval_sec: 300     # compactor 扫描周期（秒）

storage_disk:
  path: /tmp                    # 宿主机采集/临时文件所在文件系统
  warning_free_bytes: 8589934592    # 剩余低于 8 GiB 时告警（不拒收）
  critical_free_bytes: 4294967296   # 剩余低于 4 GiB 时严重告警（不拒收）
  min_free_bytes: 1073741824        # 剩余低于 1 GiB 时拒绝新的采集

# 日志配置
log:
  level: info               # debug / info / warn / error
  format: json              # json / console
  output: stdout            # stdout / stderr / 文件路径

# 安全配置
# development 默认允许 insecure，production 必须配置 mTLS 或显式设置 allow_insecure_transport=true。
security:
  environment: development
  allow_insecure_transport: true

# 可观测性配置
observability:
  metrics_enabled: true

# Native Continuous Profiling 查询配置。MVP 未启用采样器时返回稳定空态。
profile:
  enabled: false
  timeout_sec: 5

# Agent 主动发现配置。
# extra_ips 使用逗号分隔，只写远端 Agent 自报的 IP，不包含 SSH 用户名或密码。
# 远端 drop_agent 需要同时设置 DROP_AGENT_IP 为同一个地址，首页才能稳定显示远程主机行。
agent_discovery:
  extra_ips: ""
