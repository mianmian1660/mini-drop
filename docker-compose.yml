# ============================================================
# docker-compose.yml — 一键启动整个系统 小白版注释
# ============================================================
# 一个命令启动 6 个容器：数据库 + 存储 + Server + Agent + 后台 + 前端
# 用法：docker compose up
# 注意：本 Compose 面向本地开发/演示，显式使用 development + insecure 传输；
# 生产部署请使用 deploy/kubernetes 中的 Secret/ConfigMap 模板替换凭据和证书。
#
# YAML 语法小课堂：
#   缩进表示层级（只能用空格，不能用 Tab）
#   key: value  = 键值对
#   - item      = 数组元素
#   # 注释       = 行注释
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # 本地验收用 Go pprof 服务；生产任务可填写任意 Agent 可访问的 pprof_url。
  pprof_demo:
    logging: *default-logging
    build:
      context: ./pprof_demo
    ports:
      - "6060:6060"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6060/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================================
  # PostgreSQL — 数据库
  # 存用户、任务、Agent 等所有业务数据
  # ========================================================
  postgres:
    logging: *default-logging
    image: postgres:14 # 用官方 PostgreSQL 14 镜像
    environment:
      # 环境变量（相当于配置）
      POSTGRES_PASSWORD: dev # 数据库密码
      POSTGRES_DB: drop # 创建的数据库名
    ports:
      - "${POSTGRES_PORT:-15432}:5432" # 映射端口：主机:容器，默认避开宿主已有 PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data # 数据持久化（删容器不丢数据）
    healthcheck:
      # 健康检查
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # MinIO — 对象存储（替代腾讯云 COS）
  # 存 Agent 采集的 perf.data 等大文件
  # ========================================================
  minio:
    logging: *default-logging
    image: minio/minio:latest
    command: server /data --console-address ":9001" # 启动服务
    environment:
      MINIO_ROOT_USER: drop # 管理员用户名
      MINIO_ROOT_PASSWORD: dropdrop # 管理员密码
    ports:
      - "9000:9000" # S3 API 端口
      - "9001:9001" # Web 管理界面端口
    volumes:
      - miniodata:/data # 数据持久化
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 初始化：创建 bucket 并设为公开读取（火焰图 SVG 可直接访问）
  minio-init:
    logging: *default-logging
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 drop dropdrop; mc mb --ignore-existing myminio/drop-data; mc anonymous set public myminio/drop-data; echo 'MinIO init: bucket=drop-data, policy=public'; "

  # ========================================================
  # drop_server — C++ 调度中心
  # 接收心跳、派发任务、收结果
  # ========================================================
  drop_server:
    logging: *default-logging
    build:
      # 从 Dockerfile 构建（不从镜像仓库拉）
      context: ./drop # Dockerfile 所在目录
      dockerfile: Dockerfile
    command: ./drop_server # 容器启动后执行的命令
    ports:
      - "50051:50051" # gRPC 端口
    depends_on:
      # 依赖：等 postgres 就绪再启动
      postgres:
        condition: service_healthy

  # ========================================================
  # drop_agent — C++ 采集探针
  # 运行在被监控机器上，执行 perf 等采集工具
  # ========================================================
  drop_agent:
    logging: *default-logging
    stop_grace_period: 30s
    build:
      context: ./drop
      dockerfile: Dockerfile
    command: ./drop_agent localhost:50051 # network_mode=host 时用 localhost 访问 drop_server
    environment:
      DROP_PERF_BIN: "/usr/local/bin/perf-real"
      DROP_AGENT_HOSTNAME: "cloud-server-111-230-29-115"
      DROP_AGENT_IP: "111.230.29.115"
      DROP_NATIVE_CP_ENABLED: "${DROP_NATIVE_CP_ENABLED:-true}"
      DROP_NATIVE_CP_EBPF_ENABLED: "${DROP_NATIVE_CP_EBPF_ENABLED:-true}"
      DROP_NATIVE_CP_SIGNALS: "${DROP_NATIVE_CP_SIGNALS:-cpu,io,sched}"
      DROP_NATIVE_CP_CPU_BACKENDS: "${DROP_NATIVE_CP_CPU_BACKENDS:-perf}"
      DROP_NATIVE_CP_CORE_OBJECT: "/app/native_cp.bpf.o"
      # 云 VM 硬件 cycles 计数器可能冻结，perf 默认 cycles 采不到样本；
      # 默认改用软件事件 cpu-clock（Step 1 实测），可覆盖。
      DROP_NATIVE_CP_PERF_EVENT: "${DROP_NATIVE_CP_PERF_EVENT:-cpu-clock}"
      DROP_NATIVE_CP_PYTHON_FALLBACK_ENABLED: "${DROP_NATIVE_CP_PYTHON_FALLBACK_ENABLED:-true}"
      DROP_NATIVE_CP_PYTHON_MAX_PROCESSES: "${DROP_NATIVE_CP_PYTHON_MAX_PROCESSES:-4}"
      DROP_NATIVE_CP_PYTHON_RATE_HZ: "${DROP_NATIVE_CP_PYTHON_RATE_HZ:-19}"
      DROP_NATIVE_CP_PYTHON_RSS_ENABLED: "${DROP_NATIVE_CP_PYTHON_RSS_ENABLED:-true}"
      DROP_NATIVE_CP_PYTHON_RSS_MAX_PROCESSES: "${DROP_NATIVE_CP_PYTHON_RSS_MAX_PROCESSES:-128}"
      DROP_NATIVE_CP_MEMRAY_INGEST_ENABLED: "${DROP_NATIVE_CP_MEMRAY_INGEST_ENABLED:-true}"
      # io/sched histogram 采集时长（秒），默认比 CPU 窗口短 3s，避免拖长窗口
      DROP_NATIVE_CP_HISTOGRAM_SEC: "${DROP_NATIVE_CP_HISTOGRAM_SEC:-}"
      DROP_BTF_PATH: "${DROP_BTF_PATH:-}"
      DROP_NATIVE_CP_API_BASE_URL: "${DROP_NATIVE_CP_API_BASE_URL:-http://127.0.0.1:8191}"
      DROP_NATIVE_CP_SPOOL_DIR: "/var/lib/mini-drop/continuous-spool"
      DROP_NATIVE_CP_SPOOL_MAX_BYTES: "${DROP_NATIVE_CP_SPOOL_MAX_BYTES:-5368709120}"
      DROP_NATIVE_CP_SPOOL_MIN_FREE_BYTES: "${DROP_NATIVE_CP_SPOOL_MIN_FREE_BYTES:-2147483648}"
      DROP_NATIVE_CP_RETRY_MAX_SEC: "${DROP_NATIVE_CP_RETRY_MAX_SEC:-300}"
      DROP_GO_SYMBOL_CACHE_DIR: "/var/lib/mini-drop/symbol-cache"
      DROP_GO_SYMBOL_TIMEOUT_SEC: "${DROP_GO_SYMBOL_TIMEOUT_SEC:-120}"
      # GoReSym 解析大型 stripped Go ELF 时可能占用数 GiB；用 Go runtime
      # 软上限配合容器硬上限，避免小内存宿主机进入 swap 风暴。
      DROP_GO_SYMBOL_MEMORY_LIMIT: "${DROP_GO_SYMBOL_MEMORY_LIMIT:-1024MiB}"
      DROP_GO_SYMBOL_GOGC: "${DROP_GO_SYMBOL_GOGC:-20}"
      DROP_GO_SYMBOL_CACHE_MAX_BYTES: "${DROP_GO_SYMBOL_CACHE_MAX_BYTES:-536870912}"
      DROP_GO_SYMBOL_CACHE_MAX_FILES: "${DROP_GO_SYMBOL_CACHE_MAX_FILES:-256}"
      # 整机磁盘采集的 statvfs 路径：容器 overlay 容量无意义，指向宿主机
      # 根分区上的绑定目录（/tmp 挂载宿主根分区），页面统一标记为"系统盘 /"。
      DROP_HOST_DISK_MOUNT: "${DROP_HOST_DISK_MOUNT:-/tmp}"
    cpus: "${DROP_AGENT_CPU_LIMIT:-1.0}"
    mem_limit: "${DROP_AGENT_MEMORY_LIMIT:-2g}"
    memswap_limit: "${DROP_AGENT_MEMORY_LIMIT:-2g}"
    network_mode: host # 使用宿主机网络（需要 perf 权限）
    privileged: true # 特权模式（perf 需要）
    pid: host # 使用宿主机 PID 命名空间
    security_opt:
      - apparmor:unconfined # bpftrace 访问 tracefs/debugfs 时避免被 AppArmor 拦截
    cap_add:
      # 添加 Linux 能力
      - SYS_ADMIN
      - SYS_PTRACE
      - PERFMON
      - BPF
      - SYS_RESOURCE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
      - /sys/kernel/tracing:/sys/kernel/debug/tracing:rw
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /lib/modules:/lib/modules:ro
      # async-profiler 的 collapsed 输出由宿主 JVM 直接写文件（JVM 命名空间），
      # 共享 /tmp 让容器内 agent 能读到 asprof 产物（否则 resultCode=-6 产物缺失）。
      - /tmp:/tmp
      # Phase 5 验收：把 agent 配置文件挂进容器，让 CleanupWorker 的
      # cleanupIntervalSec/taskDirRetentionSec/orphanPidGraceSec 等参数
      # 能在验收时调整生效（镜像本身未打包 etc/agent_config.json）。
      - ./drop/etc/agent_config.json:/app/etc/agent_config.json:ro
      - /var/lib/mini-drop/continuous-spool:/var/lib/mini-drop/continuous-spool
      - gosymbolcache:/var/lib/mini-drop/symbol-cache
    depends_on:
      - drop_server

  # ========================================================
  # apiserver — Go HTTP 后台
  # 前端和底层系统之间的"中间人"
  # ========================================================
  apiserver:
    logging: *default-logging
    build:
      context: ./apiserver
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8191:8191" # HTTP API 端口
    environment:
      PG_DSN: "host=postgres user=postgres password=dev dbname=drop sslmode=disable"
      DROP_GRPC: "drop_server:50051" # drop_server 的地址
      MINI_DROP_ENV: "development"
      ALLOW_INSECURE_TRANSPORT: "true"
      METRICS_ENABLED: "true"
      PROFILE_ENABLED: "true"
      AGENT_DISCOVERY_EXTRA_IPS: "111.230.29.115" # 远端 drop_agent 自报该 IP 后，首页会显示独立远程主机
      S3_ENDPOINT: "minio:9000" # MinIO 地址（Docker 内部网络）
      S3_PUBLIC_ENDPOINT: "localhost:9000" # 浏览器访问地址（预签名 URL 用）
      S3_ACCESS_KEY: "drop"
      S3_SECRET_KEY: "dropdrop"
      RETENTION_ENABLED: "true"
      ARTIFACT_RAW_RETENTION_HOURS: "24"
      ARTIFACT_RESULT_RETENTION_HOURS: "720"
      RETENTION_CLEANUP_INTERVAL_SEC: "300"
      RETENTION_BATCH_LIMIT: "1000"
      STORAGE_DISK_PATH: "${STORAGE_DISK_PATH:-/tmp}"
      STORAGE_MIN_FREE_BYTES: "${STORAGE_MIN_FREE_BYTES:-1073741824}"
      CONTINUOUS_SUMMARY_RETENTION_HOURS: "168"
      # 阶段三：内建持续剖析块存储（compactor）
      # 每个 session 每小时一个 gzip 压缩块；开启后查询自动按 object_key+batch_bid
      # 加载块（旧分钟对象兼容读取），未开启时行为与阶段二完全一致。
      CONTINUOUS_BLOCK_ENABLED: "${CONTINUOUS_BLOCK_ENABLED:-true}"
      CONTINUOUS_BLOCK_WINDOW_SEC: "${CONTINUOUS_BLOCK_WINDOW_SEC:-3600}"
      CONTINUOUS_BLOCK_COMPACTION_DELAY_SEC: "${CONTINUOUS_BLOCK_COMPACTION_DELAY_SEC:-600}"
      CONTINUOUS_BLOCK_COMPACTION_INTERVAL_SEC: "${CONTINUOUS_BLOCK_COMPACTION_INTERVAL_SEC:-300}"
    extra_hosts:
      - "localhost:host-gateway" # 让容器内也能通过 localhost 访问宿主机上的 MinIO 端口
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      drop_server:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8191/healthz >/dev/null 2>&1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ========================================================
  # analysis — Python 分析引擎（守护模式）
  # 轮询数据库中已完成的任务，自动触发火焰图/热点/建议分析
  # ========================================================
  analysis:
    logging: *default-logging
    build:
      context: ./analysis
      dockerfile: Dockerfile
    environment:
      PG_DSN: "host=postgres user=postgres password=dev dbname=drop sslmode=disable"
      MINI_DROP_ENV: "development"
      ALLOW_INSECURE_TRANSPORT: "true"
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "drop"
      S3_SECRET_KEY: "dropdrop"
      ANALYSIS_WORK_ROOT: "/tmp/mini-drop-analysis"
    depends_on:
      - postgres
      - minio
    entrypoint: [ "python3", "analysis_daemon.py", "--interval", "5" ]

  # ========================================================
  # web_frontend — React 前端（Nginx 托管）
  # 用户浏览器访问的就是这个
  # ========================================================
  web_frontend:
    logging: *default-logging
    build:
      context: ./web_frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" # 浏览器默认 HTTP 端口
    environment:
      HOST_URL: "http://localhost:8191" # API 后台地址
    depends_on:
      apiserver:
        condition: service_healthy

# ============================================================
# 数据卷（Docker 管理的持久化存储）
# 删掉容器数据还在，除非手动 docker volume rm
# ============================================================
volumes:
  pgdata:
  miniodata:
  gosymbolcache:
