// ============================================================
// common.proto — 通用数据结构
// ============================================================
// 小白理解：就像 C 语言的 .h 头文件，定义"结构体"
// 其他 proto 文件可以 import 这个文件来复用这些结构
// ============================================================

syntax = "proto3";  // 使用 proto3 语法（最新版）

package common;  // 命名空间，防止名字冲突
// go_package：告诉 protoc 生成的 Go 代码放在哪个 Go 包里
option go_package = "github.com/mini-drop/apiserver/proto/common";

// ----------------------------------------------------------
// PidStats：进程的资源占用情况
// 类似 Linux 的 top 命令看到的信息
// ----------------------------------------------------------
message PidStats {
  int32  pid         = 1;  // 进程 ID
  double cpuPercent  = 2;  // CPU 使用率，比如 45.5 表示 45.5%
  uint64 rssKb       = 3;  // 物理内存占用（KB）
  uint64 readKbPerS  = 4;  // 每秒从磁盘读了多少 KB
  uint64 writeKbPerS = 5;  // 每秒往磁盘写了多少 KB
  string comm        = 6;  // 进程名字，比如 "nginx"
}
// 注意：每个字段后面的 =1 =2 =3 是"字段编号"，
// 不是默认值！它们是 protobuf 用来识别字段的序号

// ----------------------------------------------------------
// HostStats：整台宿主机的资源占用情况（与 PidStats 的进程维度不同）
// 由 drop_agent 随心跳上报；旧 Agent 不填该字段（has_host_stats()==false）。
// 每个维度带 *_available 标志：读取失败时只把对应维度置 false，
// 绝不能用 0% 冒充"无数据"。字段均为追加编号，兼容旧 Agent/Server。
// ----------------------------------------------------------
message HostStats {
  double cpu_percent        = 1;  // 整机 CPU 使用率 0-100
  bool   cpu_available      = 2;  // CPU 是否可用（/proc/stat 读取失败=false）
  uint64 memory_used_bytes  = 3;  // 已用内存（字节）
  uint64 memory_total_bytes = 4;  // 内存总量（字节）
  double memory_percent     = 5;  // 内存占用率 0-100
  bool   memory_available   = 6;  // 内存是否可用（/proc/meminfo 读取失败=false）
  uint64 disk_used_bytes    = 7;  // 磁盘已用（字节）
  uint64 disk_total_bytes   = 8;  // 磁盘总量（字节）
  double disk_percent       = 9;  // 磁盘占用率 0-100
  bool   disk_available     = 10; // 磁盘是否可用（statvfs 失败=false）
  string disk_mount         = 11; // 逻辑挂载点标签，如 "/"
  int64  collected_at_unix_ms = 12; // 采集时间（Unix 毫秒）
}

// ----------------------------------------------------------
// HostMetadata：宿主机身份与系统信息（由 drop_agent 采集并随心跳上报）
// 与 HostStats（资源占用）不同，本消息描述"这台机器是什么"：
// 操作系统、内核、架构、CPU 型号与核数、开机时长。
// 采集失败时对应字段留空或为 0，不伪造默认值；单个字段失败不影响其他字段。
// 字段均为追加编号，兼容旧 Agent/Server。
// ----------------------------------------------------------
message HostMetadata {
  string os_name            = 1;  // 操作系统名称，如 "Ubuntu"（/etc/os-release NAME）
  string os_version         = 2;  // 操作系统版本，如 "24.04"（/etc/os-release VERSION_ID）
  string kernel_version     = 3;  // 内核版本，如 "6.8.0-31-generic"（uname -r）
  string architecture       = 4;  // 硬件架构，如 "x86_64"（uname -m）
  string cpu_model          = 5;  // CPU 型号，如 "AMD EPYC 7B12"（/proc/cpuinfo model name）
  int32  cpu_cores          = 6;  // 在线 CPU 核数（sysconf(_SC_NPROCESSORS_ONLN)）
  int64  uptime_seconds     = 7;  // 开机时长（秒，/proc/uptime）
  int64  collected_at_unix_ms = 8; // 采集时间（Unix 毫秒）
}

// ----------------------------------------------------------
// AttemptStatus：Agent 心跳里汇报的执行尝试
// ----------------------------------------------------------
message AttemptStatus {
  string taskID      = 1;
  uint64 attempt_id  = 2;
}

// ----------------------------------------------------------
// File：文件描述（传输小文件用）
// ----------------------------------------------------------
message File {
  string name    = 1;  // 文件名，比如 "perf.data"
  bytes  content = 2;  // 文件的二进制内容
  int64  size    = 3;  // 文件大小（字节）
}

// ----------------------------------------------------------
// CosConfig：对象存储（MinIO/COS）的连接信息
// 就像是一把"临时钥匙"，让 Agent 知道上传到哪里
// ----------------------------------------------------------
message CosConfig {
  string endpoint        = 1;  // 存储服务地址，比如 "minio:9000"
  string accessKeyId     = 2;  // 用户名
  string secretAccessKey = 3;  // 密码
  string bucket          = 4;  // 存储桶名（相当于文件夹）
  string region          = 5;  // 区域（MinIO 可以不填）
  string sessionToken    = 6;  // 临时令牌（提高安全性）
  int64  expireTime      = 7;  // 过期时间
  bool   useSsl          = 8;  // 是否用 HTTPS
}
