object_storage:
  bucket:
    type: "FILESYSTEM"
    config:
      directory: "/var/lib/parca/object-storage"

scrape_configs:
  - job_name: "parca"
    scrape_interval: "10s"
    static_configs:
      - targets: ["parca:7070"]
        labels:
          env: "development"
          instance: "parca:7070"
          node: "mini-drop-local"

  - job_name: "pprof_demo"
    scrape_interval: "10s"
    static_configs:
      - targets: ["pprof_demo:6060"]
        labels:
          env: "development"
          instance: "pprof_demo:6060"
          node: "mini-drop-local"
